[project]
package-mode = false
name = "pcb-defect-detector"
version = "1.1.0"
description = "A defect detector built to help analysing AtlasITK circuit boards"
authors = [
    {name = "Gabriel Vandersippe",email = "gabriel.vandersippe@etu.minesparis.psl.eu"},
    {name = "Lucas Duhautois",email = "lucas.duhautois@etu.minesparis.psl.eu"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy (==2.4.4)",
    "opencv-python (==4.13.0.92)",
    "scipy (==1.17.1)",
    "matplotlib (==3.10.8)",
    "rich (==14.3.3)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
